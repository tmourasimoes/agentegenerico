<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Main N Neon Cyan-to-Purple Gradient -->
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Diagonal Ribbon Highlight Gradient -->
    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Soft Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Ambient Outer Glow -->
  <path d="M 130,110 L 195,110 L 317,290 L 317,110 L 382,110 L 382,402 L 317,402 L 195,222 L 195,402 L 130,402 Z"
        fill="url(#n-grad)" opacity="0.4" filter="url(#neon-glow)" />

  <!-- Main Geometric 'N' Structure -->
  <path d="M 130,110 L 195,110 L 317,290 L 317,110 L 382,110 L 382,402 L 317,402 L 195,222 L 195,402 L 130,402 Z"
        fill="url(#n-grad)" stroke="#00f2fe" stroke-width="2" stroke-linejoin="round"/>

  <!-- 3D Diagonal Ribbon Overlay -->
  <path d="M 130,110 L 195,110 L 382,402 L 317,402 Z"
        fill="url(#highlight-grad)"/>

  <!-- Top Sharp Edge Specular Highlight -->
  <path d="M 130,110 L 195,110 L 382,402"
        fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
</svg>
